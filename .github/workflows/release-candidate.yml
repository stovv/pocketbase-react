name: Release Candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  build-rc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Update package.json for publishing
        run: |
          # Ensure the package name has the correct scope
          jq '.name = "@${{ github.repository_owner }}/pocketbase-react"' package.json > package_tmp.json
          mv package_tmp.json package.json

      - name: Update lockfile
        run: YARN_ENABLE_HARDENED_MODE=0 yarn install --mode update-lockfile

      - name: Install dependencies
        run: YARN_ENABLE_HARDENED_MODE=0 yarn install

      - name: Generate RC version
        id: rc-version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMIT_SHA=${{ github.event.pull_request.head.sha }}
          SHORT_SHA=${COMMIT_SHA:0:7}
          RC_VERSION="${BASE_VERSION}-rc.${PR_NUMBER}.${SHORT_SHA}"
          echo "RC_VERSION=${RC_VERSION}" >> $GITHUB_ENV
          echo "version=${RC_VERSION}" >> $GITHUB_OUTPUT

      - name: Update package version
        run: |
          npm version ${{ env.RC_VERSION }} --no-git-tag-version

      - name: Build package
        run: yarn build

      - name: Pack package
        run: |
          yarn pack
          PACKAGE_NAME=$(ls -d $PWD/*.tgz)
          echo "Packed package: $PACKAGE_NAME"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        if: env.PACKAGE_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: pocketbase-react-rc
          path: "*.tgz"
          retention-days: 5

  publish-rc:
    needs: build-rc
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pocketbase-react-rc

      - name: Get package path
        run: |
          PACKAGE_NAME=$(ls -d $PWD/*.tgz)
          echo "Packed package: $PACKAGE_NAME"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

      - name: Publish to GitHub Packages
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          registry: "https://npm.pkg.github.com"
          package: ${{ env.PACKAGE_NAME }}
          tag: rc
          access: public

      - name: Generate RC version
        id: rc-version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMIT_SHA=${{ github.event.pull_request.head.sha }}
          SHORT_SHA=${COMMIT_SHA:0:7}
          RC_VERSION="${BASE_VERSION}-rc.${PR_NUMBER}.${SHORT_SHA}"
          echo "RC_VERSION=${RC_VERSION}" >> $GITHUB_ENV
          echo "version=${RC_VERSION}" >> $GITHUB_OUTPUT

      - name: Comment PR about publish
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.RC_VERSION;
            const pkgName = `@${context.repo.owner}/${context.repo.repo}`;

            const body = `📦 RC package has been published to GitHub Packages!\n\n` +
                        `You can install it with:\n` +
                        `\`\`\`bash\n` +
                        `yarn add ${pkgName}@${version}\n` +
                        `\`\`\``;

            await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: body
                        });